<div class="dx-card" style="padding: 10px; margin-top: -10px;">
  <div class="paramsDiv SearchParams-container" [ngClass]="{ 'hide-content': !isContentVisible }">
    <div class="filter-section">
      <div class="filter-group">
        <div class="filter-item">
          <label>Year</label>
          <dx-select-box [items]="years" [(value)]="selectedYear" (onValueChanged)="onYearChanged($event)">
          </dx-select-box>
        </div>

        <div class="filter-item">
          <label>Month</label>
          <dx-select-box [items]="months" displayExpr="name" valueExpr="value" [(value)]="selectedMonth"
            (onValueChanged)="onMonthChanged($event)">
          </dx-select-box>
        </div>

        <div class="filter-item">
          <label>From</label>
          <dx-date-box type="date" displayFormat="dd/MM/yyyy" [(value)]="startDate" [max]="today">
          </dx-date-box>
        </div>

        <div class="filter-item">
          <label>To</label>
          <dx-date-box type="date" displayFormat="dd/MM/yyyy" [(value)]="endDate" [max]="today">
          </dx-date-box>
        </div>
      </div>

      <div class="action-item">
        <dx-button text="Apply" type="success" stylingMode="contained" (onClick)="applyFilter()" class="apply-btn">
        </dx-button>
      </div>
    </div>
  </div>

  <div class="button-container mt-1 mb-2 d-flex justify-content-center">
    <dx-button class="toggleButton" icon="{{ isContentVisible ? 'chevronup' : 'chevrondown' }}" stylingMode="outlined"
      type="normal" [hint]="isContentVisible ? 'Hide Filter Content' : 'Show Filter Field'" [width]="200" [height]="13"
      (onClick)="toggleContent()">
    </dx-button>
  </div>

  <dx-data-grid
    id="timesheetSummaryGrid"
    [dataSource]="timesheetData"
    [showBorders]="true"
    [columnAutoWidth]="true"
    [allowColumnReordering]="true"
    height="calc(100vh - 210px)"
  >
    <dxo-scrolling mode="standard" showScrollbar="always"></dxo-scrolling>

    <dxo-paging [pageSize]="10"></dxo-paging>
    <dxo-pager [visible]="true" [allowedPageSizes]="[5, 10, 'all']" [showPageSizeSelector]="true" [showInfo]="true"
      [showNavigationButtons]="true">
    </dxo-pager>

    <dxo-header-filter [visible]="isFilterRowVisible">
      <dxo-search [enabled]="true"></dxo-search>
    </dxo-header-filter>
    <dxo-filter-row [visible]="isFilterRowVisible"></dxo-filter-row>
    <dxo-column-chooser [enabled]="true" [height]="400"></dxo-column-chooser>
    <dxo-export [enabled]="true" [allowExportSelectedData]="false" [formats]="['xlsx']"></dxo-export>

    <dxo-toolbar>
      <dxi-item location="before">
        <div class="grid-header" style="margin-right: 20px;">Timesheet Summary</div>
      </dxi-item>
      <dxi-item location="after" locateInMenu="auto" showText="inMenu" widget="dxButton" [options]="{
            icon: isFilterRowVisible ? 'filter' : 'filter',
            hint: isFilterRowVisible ? 'Hide Filter Row' : 'Show Filter Row',
            onClick: toggleFilterRow,
            stylingMode: 'text',
            elementAttr: { class: 'commonButtons' }
          }"></dxi-item>
      <dxi-item location="after" locateInMenu="auto" showText="inMenu" widget="dxButton" [options]="{
            icon: 'refresh',
            hint: 'Refresh',
            onClick: refresh,
            stylingMode: 'text'
          }"></dxi-item>
      <dxi-item name="exportButton" location="after" cssClass="custom-export-button"></dxi-item>
      <dxi-item name="columnChooserButton" location="after"></dxi-item>
    </dxo-toolbar>

    <dxo-group-panel [visible]="true"
      emptyPanelText="Drag a column header here to group by that column"></dxo-group-panel>
    <dxo-grouping [contextMenuEnabled]="true" [autoExpandAll]="true"></dxo-grouping>

    <dxi-column dataField="ProjectName" caption="Project" sortOrder="asc"></dxi-column>
    <dxi-column dataField="EmployeeName" caption="Employee"></dxi-column>
    <dxi-column dataField="TotalHours" caption="Total Hours" dataType="number" format="#,##0.00"></dxi-column>

    <dxi-column caption="Action" [width]="80" [fixed]="true" fixedPosition="right" cellTemplate="actionTemplate" alignment="center"></dxi-column>

    <div *dxTemplate="let cellData of 'actionTemplate'" style="text-align: center;">
      <i class="fas fa-eye" title="View Details" (click)="showDetailsPopup(cellData)" style="cursor: pointer; font-size: 16px; color: #007bff;"></i>
    </div>

    <dxo-summary [calculateCustomSummary]="calculateCustomSummary">
      <dxi-group-item name="totalHoursSummary" column="TotalHours" summaryType="custom" [alignByColumn]="true"
        displayFormat="{0}">
      </dxi-group-item>
    </dxo-summary>

  </dx-data-grid>
</div>

<dx-popup
  [(visible)]="isDetailsPopupVisible"
  [title]="detailsPopupTitle"
  [width]="900"
  height="auto"
  maxHeight="80vh"
  [showTitle]="true"
  [dragEnabled]="true"
  [closeOnOutsideClick]="true"
  [showCloseButton]="true"
>
  <div *dxTemplate="let data of 'content'">
    <dx-data-grid 
      [dataSource]="timesheetDetailsData" 
      [showBorders]="true"
      [allowColumnResizing]="true"
      columnResizingMode="widget"
      height="100%">
      
      <dxo-scrolling mode="standard" showScrollbar="always"></dxo-scrolling>
      <dxo-paging [enabled]="false"></dxo-paging>
      <dxo-header-filter [visible]="true"></dxo-header-filter>
      <dxo-filter-row [visible]="true" [showOperationChooser]="false"></dxo-filter-row>

      <dxi-column dataField="Date" caption="Date" dataType="date" format="dd/MM/yyyy" [width]="100" sortOrder="desc"></dxi-column>
      <dxi-column dataField="Activity" caption="Activity" [width]="150"></dxi-column>
      <dxi-column dataField="Description" caption="Description" cellTemplate="descriptionTemplate"></dxi-column>
      <dxi-column dataField="TotalHours" caption="Total Hours" dataType="number" format="#,##0.00" [width]="130"></dxi-column>
      
      <div *dxTemplate="let cell of 'descriptionTemplate'">
        <div style="white-space: normal; word-wrap: break-word; overflow-wrap: break-word; max-width: 100%;">
          {{ cell.value }}
        </div>
      </div>
      
      <dxo-summary>
        <dxi-total-item column="TotalHours" summaryType="sum" displayFormat="{0}" valueFormat="#,##0.00"></dxi-total-item>
      </dxo-summary>

    </dx-data-grid>
  </div>
</dx-popup>
