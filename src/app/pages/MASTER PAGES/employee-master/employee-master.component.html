<div class="view-wrapper list-page">
  <dx-data-grid class="grid theme-dependent" noDataText="" [dataSource]="datasource" [showBorders]="true"
    [allowColumnResizing]="true" [allowColumnReordering]="true" [rowAlternationEnabled]="true"
    rowAlternationInterval="2" (onEditingStart)="onEditingRow($event)" (onRowRemoving)="onRowRemoving($event)"
    height="78vh">
    <dxo-paging [pageSize]="10"></dxo-paging>
    <dxo-editing mode="popup" [allowUpdating]="true" [allowDeleting]="true">
    </dxo-editing>
    <dxo-pager [visible]="true" [allowedPageSizes]="allowedPageSizes" [displayMode]="displayMode"
      [showPageSizeSelector]="showPageSizeSelector" [showInfo]="showInfo"
      [showNavigationButtons]="showNavButtons"></dxo-pager>
    <dxo-load-panel [showPane]="false"></dxo-load-panel>
    <dxo-scrolling mode="virtual"></dxo-scrolling>
    <dxo-sorting mode="multiple"></dxo-sorting>
    <dxo-header-filter [visible]="isFilterRowVisible">
      <dxo-search [enabled]="true"></dxo-search>
    </dxo-header-filter>
    <dxo-filter-row [visible]="isFilterRowVisible"></dxo-filter-row>
    <dxo-column-chooser [enabled]="true" [height]="400"></dxo-column-chooser>
    <dxo-search-panel [visible]="true" placeholder=" Search"></dxo-search-panel>
    <dxo-export [enabled]="true" [allowExportSelectedData]="false" [formats]="['xlsx']">
    </dxo-export>

    <dxo-toolbar>
      <dxi-item location="before">
        <div class="grid-header">Employee Master</div>
      </dxi-item>
      <dxi-item location="after" locateInMenu="auto" showText="inMenu" widget="dxButton" [options]="{
          icon: isFilterRowVisible ? 'filter' : 'filter',
          hint: isFilterRowVisible ? 'Hide Filter Row' : 'Show Filter Row',
          onClick: toggleFilterRow,
          stylingMode: 'text',
          elementAttr: { class: 'commonButtons' }
        }"></dxi-item>
      <dxi-item location="after" locateInMenu="auto" showText="inMenu" widget="dxButton" [options]="{
          text: 'Refresh',
          icon: 'refresh',
          stylingMode: 'text',
          hint: 'refresh',
          onClick: refresh,

        }"></dxi-item>

      <dxi-item name="exportButton" location="after" cssClass="custom-export-button"></dxi-item>
      <dxi-item location="after" widget="dxButton" [options]="addButtonOptions"></dxi-item>
    </dxo-toolbar>

    <dxi-column caption="S.No" cellTemplate="rowIndexTemplate" [width]="70" [allowFiltering]="false"
      [allowSorting]="false"></dxi-column>
    <dxi-column dataField="EmployeeName" caption="Employee Name"></dxi-column>
    <dxi-column dataField="DesignationName" caption="Designation"></dxi-column>
    <dxi-column dataField="MobileNo" caption="Mobile"></dxi-column>
    <dxi-column dataField="WhatsappNo" caption="Whatsapp No"></dxi-column>
    <dxi-column dataField="EmailID" caption="Email"></dxi-column>
    <dxi-column dataField="SexName" caption="Gender"></dxi-column>
    <dxi-column dataField="IsWorking" caption="Status" cellTemplate="statusTemplate"></dxi-column>
    <dxi-column type="buttons" width="120">
      <dxi-button name="edit" [visible]="true"></dxi-button>
      <dxi-button hint="Reset 2FA" icon="refresh" [onClick]="reset2FAClick"></dxi-button>
      <dxi-button name="delete" [visible]="canShowDelete"></dxi-button>
    </dxi-column>

    <div *dxTemplate="let data of 'rowIndexTemplate'">
      {{ data.rowIndex + 1 }}
    </div>

    <div *dxTemplate="let data of 'statusTemplate'">
      {{ data.value ? 'Working' : 'Not Working' }}
    </div>
  </dx-data-grid>
  <form-popup class="formPopupClass" [(visible)]="isAddFormPopupOpened" titleText="New Employee" [height]="'auto'"
    [width]="popupwidth" (save)="onClickSaveNewData()" (clear)="onClearData()">
    <app-new-employeemaster *ngIf="isAddFormPopupOpened"></app-new-employeemaster>
  </form-popup>

  <dx-popup [(visible)]="isEditPopupOpened" title="Edit Employee" [height]="'auto'" [width]="popupwidth">
    <app-employeemaster-edit *ngIf="isEditPopupOpened" [formdata]="selectedRowData" (closeForm)="CloseEditForm()"></app-employeemaster-edit>
  </dx-popup>
</div>
