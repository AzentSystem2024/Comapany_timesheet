<div class="view-wrapper list-page">
  <dx-data-grid
    #timeSheetGrid
    class="grid theme-dependent"
    noDataText=""
    [dataSource]="datasource"
    [showBorders]="true"
    [allowColumnResizing]="true"
    [allowColumnReordering]="true"
    [rowAlternationEnabled]="true"
    rowAlternationInterval="2"
    (onEditingStart)="onEditingRow($event)"
    (onRowRemoving)="onRowRemoving($event)"
    height="78vh"
  >
    <dxo-paging [pageSize]="10"></dxo-paging>
    <dxo-editing
      mode="popup"
      [allowUpdating]="true"
      [allowDeleting]="true"
    >
    </dxo-editing>
    <dxo-pager
      [visible]="true"
      [allowedPageSizes]="allowedPageSizes"
      [displayMode]="displayMode"
      [showPageSizeSelector]="showPageSizeSelector"
      [showInfo]="showInfo"
      [showNavigationButtons]="showNavButtons"
    ></dxo-pager>
    <dxo-load-panel [showPane]="false"></dxo-load-panel>
    <dxo-scrolling mode="virtual"></dxo-scrolling>
    <dxo-sorting mode="multiple"></dxo-sorting>
    <dxo-header-filter [visible]="isFilterRowVisible">
      <dxo-search [enabled]="true"></dxo-search>
    </dxo-header-filter>
    <dxo-filter-row [visible]="isFilterRowVisible"></dxo-filter-row>
    <dxo-column-chooser [enabled]="true" [height]="400"></dxo-column-chooser>
    <dxo-search-panel [visible]="true" placeholder=" Search"></dxo-search-panel>
    <dxo-export
      [enabled]="true"
      [allowExportSelectedData]="false"
      [formats]="['xlsx']"
    >
    </dxo-export>

    <dxo-toolbar>
      <dxi-item location="before">
        <div class="grid-header" style="margin-right: 20px;">Timesheet</div>
      </dxi-item>
      <dxi-item location="after" *ngIf="isAdmin" template="dateNavigatorTemplate" locateInMenu="never"></dxi-item>
      <dxi-item
        location="after"
        locateInMenu="auto"
        showText="inMenu"
        widget="dxButton"
        [options]="{
          icon: isFilterRowVisible ? 'filter' : 'filter',
          hint: isFilterRowVisible ? 'Hide Filter Row' : 'Show Filter Row',
          onClick: toggleFilterRow,
          stylingMode: 'text',
          elementAttr: { class: 'commonButtons' }
        }"
      ></dxi-item>
      <dxi-item
        location="after"
        locateInMenu="auto"
        showText="inMenu"
        widget="dxButton"
        [options]="{
          text: 'Refresh',
          icon: 'refresh',
          stylingMode: 'text',
          hint: 'refresh',
          onClick: refresh,

        }"
      ></dxi-item>

      <dxi-item
        name="exportButton"
        location="after"
        cssClass="custom-export-button"
      ></dxi-item>
      <dxi-item
        location="after"
        widget="dxButton"
        [options]="addButtonOptions"
      ></dxi-item>
    </dxo-toolbar>

    <dxi-column dataField="TimesheetDate" caption="Date" dataType="date" format="dd MMM yyyy" sortOrder="desc" *ngIf="!isAdmin"></dxi-column>

    <dxi-column caption="Sl No" cellTemplate="serialNoTemplate" [width]="70"></dxi-column>
    <dxi-column dataField="EmployeeName" caption="Employee Name"></dxi-column>
    <dxi-column dataField="TimesheetDate" caption="Timesheet Date" dataType="date" format="dd-MMM-yyyy"></dxi-column>
    <dxi-column dataField="Hours" caption="Total Hours" dataType="number" format="#,##0.00"></dxi-column>
    <dxi-column dataField="timeOfEntry" caption="Time of Entry" dataType="string" cellTemplate="timeTemplate"></dxi-column>

    <div *dxTemplate="let data of 'serialNoTemplate'">
      {{ data.component.pageIndex() * data.component.pageSize() + data.rowIndex + 1 }}
    </div>

    <dxi-column type="buttons" caption="Action" [width]="160">
      <dxi-button
        name="edit"
        [visible]="isEditDeleteAllowed"
      ></dxi-button>
      <dxi-button
        name="delete"
        [visible]="isAdmin"
      ></dxi-button>
      <dxi-button
        name="viewDetails"
        hint="View Details"
        [onClick]="onViewClick"
        template="viewIconTemplate"
      ></dxi-button>
    </dxi-column>

    <span *dxTemplate="let data of 'viewIconTemplate'">
      <i class="bi bi-eye-fill" style="color: #007bff; font-size: 16px; cursor: pointer; vertical-align: middle;" title="View Details"></i>
    </span>

    <div *dxTemplate="let data of 'timeTemplate'">
      {{ formatTime(data.data.timeOfEntry || data.data.TimeOfEntry) }}
    </div>

    <div *dxTemplate="let data of 'dateNavigatorTemplate'">
      <div class="date-navigator d-flex align-items-center" style="gap: 10px;">
        <dx-button icon="chevronleft" stylingMode="text" (onClick)="previousDate()"></dx-button>
        <dx-date-box
          [(value)]="selectedDate"
          displayFormat="dd MMM yyyy"
          type="date"
          width="200"
          [max]="todayDate"
          [showClearButton]="false"
          [elementAttr]="{ class: 'custom-date-box' }"
          (onValueChanged)="onDateChanged($event)">
        </dx-date-box>
        <dx-button icon="chevronright" stylingMode="text" [disabled]="isNextDateDisabled()" (onClick)="nextDate()" [elementAttr]="{ class: 'date-nav-btn' }"></dx-button>
      </div>
    </div>
  </dx-data-grid>
  <dx-popup
    class="formPopupClass"
    [(visible)]="isAddFormPopupOpened"
    title="New Timesheet"
    height="auto"
    [width]="'80vw'"
    [showCloseButton]="true"
  >
    <app-time-sheet-new-form *ngIf="isAddFormPopupOpened" [selectedDate]="selectedDate" [existingTimesheets]="allTimesheets" (save)="onClickSaveNewData($event)" (close)="closeNewForm()"></app-time-sheet-new-form>
  </dx-popup>
  <dx-popup
    [(visible)]="isEditPopupOpened"
    [title]="isViewMode ? 'View Time Sheet' : 'Edit Timesheet'"
    height="auto"
    [width]="'80vw'"
  >
    <app-time-sheet-edit-form
      *ngIf="isEditPopupOpened"
      [formdata]="selectedRowData"
      [isReadOnly]="isViewMode"
      (closeForm)="CloseEditForm()"
    ></app-time-sheet-edit-form>
  </dx-popup>
</div>
