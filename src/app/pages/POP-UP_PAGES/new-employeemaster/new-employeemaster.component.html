<div class="tabs-demo view-wrapper">
  <div class="widget-container">
    <div class="employee-header">
      <label>Employee Master Details:</label>
    </div>

    <div class="employee-details">
      <div class="form-column">
        <dx-text-box
          [(value)]="newEmployeeData.EmployeeName"
          label="Employee Name"
          hint="Employee Name"
          (input)="onEmployeeNameInput($event)"
        >
          <dx-validator>
            <dxi-validation-rule
              type="required"
              message="Employee Name is required"
            ></dxi-validation-rule>
          </dx-validator>
        </dx-text-box>

        <dx-text-area
          [(value)]="newEmployeeData.Address1"
          label="Address"
          hint="Address"
          [height]="170"
        >
          <dx-validator>
            <dxi-validation-rule
              type="required"
              message="Address is required"
            ></dxi-validation-rule>
          </dx-validator>
        </dx-text-area>
      </div>

      <div class="form-column">
        <div style="display: flex; gap: 5px; width: 100%;">
          <dx-select-box
            [(value)]="newEmployeeData.MobileCountryCode"
            [items]="countryCodes"
            valueExpr="code"
            displayExpr="text"
            width="120px"
            placeholder="Code"
            label="Code"
            [searchEnabled]="true"
          ></dx-select-box>
          <dx-text-box
            style="flex: 1"
            [(value)]="newEmployeeData.MobileNo"
            placeholder="Mobile No."
            label="Mobile No."
            hint="Mobile No."
            [maxLength]="10"
            (input)="onPhoneInput($event, 'MobileNo')"
          >
            <dx-validator>
              <dxi-validation-rule type="required" message="Mobile No is required"></dxi-validation-rule>
              <dxi-validation-rule type="stringLength" [max]="10" message="Mobile No must not exceed 10 digits"></dxi-validation-rule>
            </dx-validator>
          </dx-text-box>
        </div>

        <dx-text-box
          [(value)]="newEmployeeData.LoginPassword"
          label="Login Password"
          hint="Login Password"
          [mode]="passwordMode"
        >
          <dxi-button
            name="password"
            location="after"
            [options]="passwordButtonOptions"
          ></dxi-button>
          <dx-validator>
            <dxi-validation-rule
              type="required"
              message="Password is required"
            ></dxi-validation-rule>
            <dxi-validation-rule
              type="custom"
              message="Password does not meet the security policy requirements"
              [validationCallback]="validatePassword"
            ></dxi-validation-rule>
          </dx-validator>
        </dx-text-box>

        <div style="display: flex; gap: 5px; width: 100%; margin-bottom: 12px;">
          <dx-select-box
            [(value)]="newEmployeeData.WhatsappCountryCode"
            [items]="countryCodes"
            valueExpr="code"
            displayExpr="text"
            width="120px"
            placeholder="Code"
            label="Code"
            [searchEnabled]="true"
          ></dx-select-box>
          <dx-text-box
            style="flex: 1"
            [(value)]="newEmployeeData.WhatsappNo"
            placeholder="Whatsapp"
            label="Whatsapp"
            hint="Whatsapp"
            [maxLength]="10"
            (input)="onPhoneInput($event, 'WhatsappNo')"
          >
            <dx-validator>
              <dxi-validation-rule type="required" message="Whatsapp No is required"></dxi-validation-rule>
              <dxi-validation-rule type="stringLength" [max]="10" message="Whatsapp No must not exceed 10 digits"></dxi-validation-rule>
            </dx-validator>
          </dx-text-box>
        </div>

        <dx-text-box
          [(value)]="newEmployeeData.EmailID"
          label="Email"
          hint="Email"
        >
          <dx-validator>
            <dxi-validation-rule
              type="required"
              message="Email is required"
            ></dxi-validation-rule>
            <dxi-validation-rule
              type="email"
              message="Enter a valid Email"
            ></dxi-validation-rule>
            <dxi-validation-rule
              type="pattern"
              [pattern]="emailPattern"
              message="Email must contain @ and end with .com"
            ></dxi-validation-rule>
            <dxi-validation-rule
              type="async"
              message="Email already exists"
              [validationCallback]="checkEmail"
            ></dxi-validation-rule>
          </dx-validator>
        </dx-text-box>
      </div>

      <div class="form-column">
        <dx-select-box
          [(value)]="newEmployeeData.DesignationID"
          [items]="designationOptions"
          valueExpr="ID"
          displayExpr="Designation"
          label="Designation"
          placeholder="Select Designation"
          hint="Designation"
        >
          <dx-validator>
            <dxi-validation-rule type="required" message="Designation is required"></dxi-validation-rule>
          </dx-validator>
        </dx-select-box>

        <dx-select-box
          [(value)]="newEmployeeData.Sex"
          [items]="[
            { id: 1, text: 'Male' },
            { id: 2, text: 'Female' },
            { id: 3, text: 'Others' }
          ]"
          valueExpr="id"
          displayExpr="text"
          label="Sex"
          placeholder="Select Sex"
          hint="Sex"
        >
          <dx-validator>
            <dxi-validation-rule type="required" message="Sex is required"></dxi-validation-rule>
          </dx-validator>
        </dx-select-box>

        <dx-date-box
          [(value)]="newEmployeeData.DateOfJoin"
          label="Date of Join"
          type="date"
          [displayFormat]="'dd/MM/yyyy'"
          placeholder="Select Date of Join"
          stylingMode="outlined"
          hint="Date of Join"
        >
          <dx-validator>
            <dxi-validation-rule type="required" message="Date of Join is required"></dxi-validation-rule>
          </dx-validator>
        </dx-date-box>

        <dx-select-box
          [(value)]="newEmployeeData.IsWorking"
          [items]="[{ id: true, text: 'Working' }, { id: false, text: 'Not Working' }]"
          valueExpr="id"
          displayExpr="text"
          label="Status"
          placeholder="Select Status"
          hint="Status"
        >
          <dx-validator>
            <dxi-validation-rule type="required" message="Status is required"></dxi-validation-rule>
          </dx-validator>
        </dx-select-box>
      </div>
    </div>

    <div class="remarks-field">
      <dx-text-area
        [(value)]="newEmployeeData.Remarks"
        label="Remarks"
        hint="Remarks"
        [height]="80"
      ></dx-text-area>

    </div>

    <div style="display: flex; justify-content: flex-end; margin-top: 15px;">
    </div>
  </div>
</div>
