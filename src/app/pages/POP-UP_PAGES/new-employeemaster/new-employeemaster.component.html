<div class="tabs-demo view-wrapper">
  <div class="widget-container">
    <div class="employee-header">
      <label>Employee Master Details:</label>
    </div>

    <div class="employee-details">
      <div class="form-column">
        <dx-text-box
          [(value)]="newEmployeeData.EmployeeName"
          label="Employee Name"
          hint="Employee Name"
          (input)="onEmployeeNameInput($event)"
        >
          <dx-validator>
            <dxi-validation-rule
              type="required"
              message="Employee Name is required"
            ></dxi-validation-rule>
          </dx-validator>
        </dx-text-box>

        <dx-text-area
          [(value)]="newEmployeeData.Address1"
          label="Address"
          hint="Address"
          [height]="170"
        >
          <dx-validator>
            <dxi-validation-rule
              type="required"
              message="Address is required"
            ></dxi-validation-rule>
          </dx-validator>
        </dx-text-area>
      </div>

      <div class="form-column">
        <dx-text-box
          [(value)]="newEmployeeData.MobileNo"
          label="Mobile No."
          hint="Mobile No."
          [maxLength]="10"
          (input)="onPhoneInput($event, 'MobileNo')"
        >
          <dx-validator>
            <dxi-validation-rule
              type="required"
              message="Mobile No is required"
            ></dxi-validation-rule>
            <dxi-validation-rule
              type="stringLength"
              [min]="10"
              [max]="10"
              message="Mobile No must be exactly 10 digits"
            ></dxi-validation-rule>
          </dx-validator>
        </dx-text-box>

        <dx-text-box
          [(value)]="newEmployeeData.LoginPassword"
          label="Login Password"
          hint="Login Password"
          [mode]="passwordMode"
        >
          <dxi-button
            name="password"
            location="after"
            [options]="passwordButtonOptions"
          ></dxi-button>
          <dx-validator>
            <dxi-validation-rule
              type="required"
              message="Password is required"
            ></dxi-validation-rule>
          </dx-validator>
        </dx-text-box>

        <dx-text-box
          [(value)]="newEmployeeData.WhatsappNo"
          label="Whatsapp"
          hint="Whatsapp"
          [maxLength]="10"
          (input)="onPhoneInput($event, 'WhatsappNo')"
        >
          <dx-validator>
            <dxi-validation-rule
              type="required"
              message="Whatsapp No is required"
            ></dxi-validation-rule>
            <dxi-validation-rule
              type="stringLength"
              [min]="10"
              [max]="10"
              message="Whatsapp No must be exactly 10 digits"
            ></dxi-validation-rule>
          </dx-validator>
        </dx-text-box>

        <dx-text-box
          [(value)]="newEmployeeData.EmailID"
          label="Email"
          hint="Email"
        >
          <dx-validator>
            <dxi-validation-rule
              type="required"
              message="Email is required"
            ></dxi-validation-rule>
            <dxi-validation-rule
              type="email"
              message="Enter a valid Email"
            ></dxi-validation-rule>
            <dxi-validation-rule
              type="pattern"
              [pattern]="emailPattern"
              message="Email must contain @ and end with .com"
            ></dxi-validation-rule>
          </dx-validator>
        </dx-text-box>
      </div>

      <div class="form-column">
        <dx-select-box
          [(value)]="newEmployeeData.DesignationID"
          [items]="designationOptions"
          valueExpr="ID"
          displayExpr="Designation"
          label="Designation"
          placeholder="Select Designation"
          hint="Designation"
        >
          <dx-validator>
            <dxi-validation-rule type="required" message="Designation is required"></dxi-validation-rule>
          </dx-validator>
        </dx-select-box>

        <dx-select-box
          [(value)]="newEmployeeData.Sex"
          [items]="[
            { id: 1, text: 'Male' },
            { id: 2, text: 'Female' },
            { id: 3, text: 'Others' }
          ]"
          valueExpr="id"
          displayExpr="text"
          label="Sex"
          placeholder="Select Sex"
          hint="Sex"
        >
          <dx-validator>
            <dxi-validation-rule type="required" message="Sex is required"></dxi-validation-rule>
          </dx-validator>
        </dx-select-box>

        <dx-date-box
          [(value)]="newEmployeeData.DateOfJoin"
          label="Date of Join"
          type="date"
          [displayFormat]="'dd/MM/yyyy'"
          placeholder="Select Date of Join"
          stylingMode="outlined"
          hint="Date of Join"
        >
          <dx-validator>
            <dxi-validation-rule type="required" message="Date of Join is required"></dxi-validation-rule>
          </dx-validator>
        </dx-date-box>

        <dx-select-box
          [(value)]="newEmployeeData.IsWorking"
          [items]="[{ id: true, text: 'Working' }, { id: false, text: 'Not Working' }]"
          valueExpr="id"
          displayExpr="text"
          label="Status"
          placeholder="Select Status"
          hint="Status"
        >
          <dx-validator>
            <dxi-validation-rule type="required" message="Status is required"></dxi-validation-rule>
          </dx-validator>
        </dx-select-box>
      </div>
    </div>

    <div class="remarks-field">
      <dx-text-area
        [(value)]="newEmployeeData.Remarks"
        label="Remarks"
        hint="Remarks"
        [height]="80"
      ></dx-text-area>
    </div>
  </div>
</div>
