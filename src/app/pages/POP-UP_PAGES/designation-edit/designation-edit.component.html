<dx-validation-group #validationGroup>
  <div class="tabs-demo view-wrapper">
    <div class="widget-container">
      <div class="employee-header">
        <label>Designation Master (Edit):</label>
      </div>

      <div class="employee-details" style="display: flex; flex-direction: column; gap: 15px; padding: 20px;">
        <dx-text-box
          [(value)]="newDesignationData.Designation"
          label="Designation Name"
          hint="Designation Name"
        >
          <dx-validator>
            <dxi-validation-rule
              type="required"
              message="Designation is required"
            ></dxi-validation-rule>
          </dx-validator>
        </dx-text-box>
      </div>
    </div>
  </div>

  <div class="form-popup-buttons-container" style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
    <dx-button
      text="Cancel"
      stylingMode="outlined"
      type="normal"
      (onClick)="close()"
    ></dx-button>
    <dx-button
      text="Save"
      stylingMode="contained"
      type="default"
      (onClick)="onSaveClick()"
    ></dx-button>
  </div>
</dx-validation-group>
