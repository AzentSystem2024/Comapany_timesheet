<dx-text-box
  valueChangeEvent="keyup input change"
  [value]="value"
  [stylingMode]="stylingMode"
  [placeholder]="placeholder"
  [mode]="isPasswordMode ? 'password' : 'text'"
  (valueChange)="onValueChange($event)"
>
  <dxi-button
    name="password"
    location="after"
    [options]="{
      icon: isPasswordMode ? 'eyeopen' : 'eyeclose',
      hoverStateEnabled: false,
      activeStateEnabled: false,
      stylingMode: 'text',
      onClick: switchMode
    }"
    cssClass="password-toggle-btn"
  ></dxi-button>
  <dx-validator
    #validator
    [validationRules]="
      validators || [{ type: 'required', message: 'Password is required' }]
    "
  ></dx-validator>
</dx-text-box>
<style>
  ::ng-deep .password-toggle-btn {
    margin-right: 25px;
  }
</style>
